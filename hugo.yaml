baseURL: https://daanschutte.github.io/
locale: en-us
title: "Daan's Cyberblog"
theme: "nuno"

params:
  defaultTheme: auto   # follows the reader's light/dark setting
  mainSections: ["posts"]
  DateFormat: "2 January 2006"
  brand: "Home"   # nav wordmark (house icon added in layouts/partials/nav.html)
  resumeLabel: "View resume"   # no PDF yet; the theme default says "Download PDF"

  author:
    name: "Daan Schutte"
  socialIcons:
    - { name: email,    url: "mailto:24-tycoon.ping@icloud.com" }
    - { name: github,   url: "https://github.com/daanschutte" }
    - { name: linkedin, url: "https://linkedin.com/in/daanschutte" }



outputs:
  home: [HTML, RSS, JSON]     # JSON is the search index

markup:
  tableOfContents: { startLevel: 2, endLevel: 3 }
  highlight: { noClasses: false }
  
caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - { identifier: posts, name: "Posts",   url: "/posts/", weight: 10 }
    - { identifier: certs, name: "Certs",   url: "/certs/", weight: 20 }
    - { identifier: resume, name: "Resume", url: "/resume/", weight: 40 }
    - { identifier: about,  name: "About",  url: "/about/",  weight: 50 }
